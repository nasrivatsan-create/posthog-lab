<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PostHog Lab</title>

<!-- Paste the PostHog loader snippet from your project here, then keep the init below -->
<script>
  !function(t,e){ /* ...PostHog loader from your project settings... */ }(document,window.posthog||[]);
  posthog.init('PASTE_YOUR_PROJECT_TOKEN', {
    api_host: 'https://us.i.posthog.com',
    defaults: '2026-01-30'      // keep whatever your own snippet shows
  });
</script>
</head>
<body style="font-family:sans-serif;max-width:480px;margin:40px auto">
  <h1>PostHog Lab</h1>
  <p>A tiny test page for practicing events, identify, funnels and feature flags.</p>

  <button id="start">Start signup</button>
  <button id="complete">Complete signup</button>
  <p id="status">Waiting for flags…</p>

  <script>
    function setStatus(msg) { document.getElementById('status').textContent = msg; }

    document.getElementById('start').addEventListener('click', function () {
      posthog.capture('signup_started', { source: 'lab_page' });
      setStatus('signup_started sent');
    });

    document.getElementById('complete').addEventListener('click', function () {
      posthog.identify('test-user-001', { plan: 'free' });   // fake ID, no real data
      posthog.capture('signup_completed', { plan: 'free' });
      setStatus('signup_completed sent');
    });

    // Flags load asynchronously, so wait for them instead of checking immediately
    posthog.onFeatureFlags(function () {
      var v = posthog.getFeatureFlag('new-signup-button');
      if (v) document.getElementById('complete').textContent = 'Create my free account';
      setStatus('Flag new-signup-button = ' + v);
    });
  </script>
</body>
</html>
