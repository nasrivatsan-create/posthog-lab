<!--  This version uses a NEW multivariate flag: signup-button-test (variants: control, test). -->
<body style="font-family:sans-serif;max-width:480px;margin:40px auto;padding:0 16px">
  <h1>PostHog Lab</h1>
  <p>A tiny test page for practicing events, identify, funnels, feature flags and experiments.</p>

  <button id="start">Start signup</button>
  <button id="complete">Complete signup</button>
  <button id="reset">New test visitor</button>
      <button id="boom">Trigger test error (caught)</button>
  <button id="boom2">Trigger test error (uncaught)</button>
  <p id="errStatus"></p>
    
  <p id="eventStatus">No events sent yet</p>
  <p id="flagStatus">Waiting for flags…</p>

  <script>
    var KEY = 'lab_test_user';
    var FLAG = 'signup-button-test';   // multivariate: control / test

    function getTestUser() { try { return localStorage.getItem(KEY); } catch (e) { return null; } }
    function setTestUser(v) { try { localStorage.setItem(KEY, v); } catch (e) {} }
    function clearTestUser() { try { localStorage.removeItem(KEY); } catch (e) {} }
    function say(id, msg) { document.getElementById(id).textContent = msg; }

    document.getElementById('start').addEventListener('click', function () {
      posthog.capture('signup_started', { source: 'lab_page' });
      say('eventStatus', 'signup_started sent');
    });

    document.getElementById('complete').addEventListener('click', function () {
      var user = getTestUser();
      if (!user) {
        user = 'test-user-' + Math.floor(Math.random() * 100000);   // fake ID
        setTestUser(user);
        posthog.identify(user, { plan: 'free' });
      }
      posthog.capture('signup_completed', { plan: 'free' });
      say('eventStatus', 'signup_completed sent as ' + user);
    });

    document.getElementById('reset').addEventListener('click', function () {
      posthog.reset();
      clearTestUser();
      say('eventStatus', 'Reset: new anonymous visitor. Reloading to get a fresh flag value...');
      setTimeout(function () { location.reload(); }, 400);
    });

    // Calling getFeatureFlag sends the exposure event ($feature_flag_called) the experiment counts.
    posthog.onFeatureFlags(function () {
      var v = posthog.getFeatureFlag(FLAG);
      document.getElementById('complete').textContent =
        (v === 'test') ? 'Create my free account' : 'Complete signup';
      say('flagStatus', 'Flag ' + FLAG + ' = ' + v);
    });

          // Error Tracking exercise: deliberate bugs, test data only
    document.getElementById('boom').addEventListener('click', function () {
      try {
        var order = null;
        order.total.toFixed(2);              // deliberate bug: reading a property of null
      } catch (e) {
        posthog.captureException(e, { lab: 'error-tracking-exercise' });
        document.getElementById('errStatus').textContent = 'Caught error reported: ' + e.message;
      }
    });

    document.getElementById('boom2').addEventListener('click', function () {
      document.getElementById('errStatus').textContent = 'Uncaught error thrown (check Error Tracking)';
      setTimeout(function () { throw new Error('Lab uncaught error: checkout failed'); }, 0);
    });
  </script>
</body>
